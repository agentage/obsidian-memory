name: Release Train

# v2-lite direct-to-master MINOR release of the Obsidian community-store plugin.
# No human step on the happy path. Weekly cadence, always a minor bump (L0).
#
# Flow: wait for org dependabot triage -> skip if no releasable commits since the
# last tag (docs/ci/plain-chore excluded, chore(deps) counts) -> minor bump via the
# repo's own `npm version` (the `version` script runs scripts/version-bump.mjs,
# updating package.json + manifest.json + versions.json) -> `npm run verify` ->
# commit `chore(release): X.Y.Z` straight to master (no release/* branch, no PR) ->
# dispatch release.yml in build-current mode, which tags the bare version X.Y.Z
# (Obsidian requires tag == manifest.json version) and builds + publishes the
# GitHub Release with the plugin assets (main.js, manifest.json, styles.css).
#
# 2026-08-22 migration off the release-PR pattern: branch -> PR -> auto-merge ->
# approve/poll broke 3 different ways in 3 weeks across the estate. This train now
# pushes the release commit straight to master and fails closed instead - a push
# failure is red (never forced), and the dispatched release.yml run is watched to
# conclusion with the published GitHub release asserted before the job is green.
on:
  schedule:
    # Single UTC cron (L0 slot). A late-firing cron means the train departs
    # late instead of being gated away - no Prague/DST hour check anymore.
    # Dependabot opens PRs 16:00 UTC Friday; org triage merges from 17:00 UTC.
    - cron: '29 4 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  dependabot-quiescence:
    name: 🤖 Wait for dependabot triage to finish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait until this repo has no fresh open dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dependabot merging is owned by the org triage automation; this job only
          # delays the train while that agent may still be working, so this week's
          # bumps ride this week's release. PRs still open after the wait were left
          # deliberately by triage - the train departs without them.
          for i in $(seq 1 45); do
            OPEN=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq 'length')
            [ "$OPEN" = "0" ] && { echo "No open dependabot PRs - proceeding."; exit 0; }
            echo "poll $i: $OPEN open dependabot PR(s), waiting for triage..."
            sleep 60
          done
          echo "Dependabot PR(s) still open after wait - releasing without them." | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: 🚝 Cut minor release direct to master
    needs: dependabot-quiescence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect releasable commits since the last tag
        id: detect
        run: |
          set -euo pipefail
          # Highest semver tag, NOT `git describe`: historical tags were made on
          # side branches and are not ancestors of master, so describe returns stale.
          LAST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
            echo "No tag found, considering full history."
          else
            RANGE="${LAST_TAG}..HEAD"
            echo "Last tag: $LAST_TAG"
          fi
          SUBJECTS=$(git log $RANGE --no-merges --pretty=%s)
          # Releasable = any commit whose type is NOT docs/chore/ci, PLUS dependency
          # bumps (chore(deps*): dependabot bundles ship weekly). chore(release) stays
          # excluded; legacy bare-version subjects (`0.2.0 (#28)`) do not count.
          if [ -n "$SUBJECTS" ]; then
            NON_CHORE=$(printf '%s\n' "$SUBJECTS" \
              | grep -vE '^(docs|chore|ci)(\([^)]*\))?!?:' \
              | grep -vcE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
            DEPS=$(printf '%s\n' "$SUBJECTS" | grep -cE '^chore\(deps' || true)
            RELEASABLE=$((NON_CHORE + DEPS))
          else
            RELEASABLE=0
          fi
          if [ "$RELEASABLE" -eq 0 ]; then
            echo "No releasable commits since ${LAST_TAG:-repo start} - no release this week." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $RELEASABLE releasable commit(s)."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump minor version (no tag)
        id: bump
        if: steps.detect.outputs.release == 'true'
        run: |
          set -euo pipefail
          # --no-git-tag-version: skip commit + tag; the `version` script still runs
          # scripts/version-bump.mjs (updates manifest.json + versions.json).
          npm version --no-git-tag-version minor
          npm install --package-lock-only
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify (type-check + lint + format + test + build + store checks)
        if: steps.bump.outputs.version
        run: npm run verify

      - name: Commit + push release directly to master
        id: push
        if: steps.bump.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git add package.json package-lock.json manifest.json versions.json
          git commit -m "chore(release): ${VERSION}"

          # Rebase onto whatever landed on master since checkout, then push
          # directly - no branch, no PR, no merge. A push failure is red, never
          # forced.
          git pull --rebase origin master
          git push origin HEAD:master

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflow (build-current)
        if: steps.push.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN push never fires other workflows, so dispatch release.yml
          # explicitly. build_current=true makes it tag + build + release the version
          # already on master's manifest.json (no re-bump, no PR).
          gh workflow run release.yml --ref master --repo "${{ github.repository }}" -f build_current=true

      - name: Wait for release.yml + verify published release
        if: steps.push.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.push.outputs.version }}"
          DISPATCH_EPOCH=$(date -u +%s)

          # gh workflow run doesn't return a run id, so poll gh run list for the
          # release.yml run that appeared after our dispatch.
          RUN_ID=""
          for i in $(seq 1 18); do
            sleep 10
            RUN_ID=$(gh run list --repo "$REPO" --workflow=release.yml --branch master \
              --json databaseId,createdAt --jq \
              "[.[] | select((.createdAt | fromdateiso8601) >= ($DISPATCH_EPOCH - 15))] | .[0].databaseId // empty")
            [ -n "$RUN_ID" ] && break
            echo "poll $i: dispatched release.yml run not visible yet..."
          done
          [ -n "$RUN_ID" ] || { echo "::error::Could not find the dispatched release.yml run."; exit 1; }

          echo "Watching release.yml run $RUN_ID to conclusion..."
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status

          echo "Verifying GitHub release ${VERSION} was published with the expected assets..."
          RELEASE_JSON=$(gh release view "$VERSION" --repo "$REPO" --json tagName,assets)
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tagName')
          [ "$TAG" = "$VERSION" ] || { echo "::error::Release tag '$TAG' does not match expected '$VERSION'"; exit 1; }
          for ASSET in main.js manifest.json styles.css; do
            echo "$RELEASE_JSON" | jq -e --arg a "$ASSET" '.assets[] | select(.name == $a)' >/dev/null \
              || { echo "::error::Release ${VERSION} is missing asset $ASSET"; exit 1; }
          done
          echo "Release ${VERSION} published with expected assets (main.js, manifest.json, styles.css)." >> "$GITHUB_STEP_SUMMARY"
          echo "Released ${VERSION} direct to master - release.yml dispatched (build-current)." >> "$GITHUB_STEP_SUMMARY"
